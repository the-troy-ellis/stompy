name: deck
on:
  push:
    paths: ['deck/**', '.github/workflows/deck.yml']
  pull_request:
    paths: ['deck/**', '.github/workflows/deck.yml']
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deck
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl1-mesa-dev
      # The runner ships rustup; no third-party actions (they'd be tools the build depends on).
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release

  # Every push to main that passes the checks becomes the build the Deck's launcher installs
  # (deck/tools/stompy-launch.sh): the release tagged deck-latest, replaced each time.
  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: deck-release
    steps:
      - uses: actions/checkout@v4
      # Valve's Steam Runtime 3 (sniper) SDK has glibc 2.31, so the binary runs on every SteamOS 3.
      - name: Build in the Steam Runtime
        run: |
          docker run --rm -v "$PWD:/src" -w /src/deck registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest sh -c '
            set -e
            git config --global --add safe.directory "*"
            pkg-config --exists sdl2 || (apt-get update && apt-get install -y libsdl2-dev)
            sh tools/build-release.sh'
      - name: Publish as deck-latest
        working-directory: deck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete deck-latest --cleanup-tag --yes || true
          gh release create deck-latest dist/stompy-deck.tar.gz dist/stompy-deck.tar.gz.sha256 \
            --target "$GITHUB_SHA" --prerelease --title "Stompy for the Deck (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. The Deck's launcher (deck/tools/stompy-launch.sh) installs this on its next start."
